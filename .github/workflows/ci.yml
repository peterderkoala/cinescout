name: CI

# Runs the same test entrypoint local dev uses (./coverage.sh, which runs the full suite exactly
# like run-tests.sh plus code coverage collection — no reason to run tests twice) on every PR and
# every direct push to main/dev. GitHub-hosted ubuntu-latest runners already have Docker reachable
# for the runner user out of the box, so the script's `sg docker` fallback (for a local machine
# whose `usermod -aG docker` hasn't taken effect yet) never triggers here — nothing to adapt.
#
# On a real push (not PRs — a PR's coverage shouldn't overwrite the live page), the merged
# coverage report + self-contained badge SVGs also get published to GitHub Pages
# (https://peterderkoala.github.io/cinescout/) via the publish-coverage job.
on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main, dev]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: "10.0.x"

      - name: Run tests with coverage
        run: ./coverage.sh

      - name: Enforce CRAP-score ceiling
        run: ./crap-check.sh

      - name: Upload coverage report (build artifact)
        uses: actions/upload-artifact@v7
        with:
          name: coverage-report
          path: coverage/report
          retention-days: 14

      - name: Upload coverage report for Pages
        if: github.event_name == 'push'
        uses: actions/upload-pages-artifact@v5
        with:
          path: coverage/report

  publish-coverage:
    if: github.event_name == 'push'
    needs: test
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy coverage report to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
