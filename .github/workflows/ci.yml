name: CI

# Runs the same test entrypoint local dev uses (./run-tests.sh) on every PR and every direct push
# to main/dev. GitHub-hosted ubuntu-latest runners already have Docker reachable for the runner
# user out of the box, so run-tests.sh's `sg docker` fallback (for a local machine whose
# `usermod -aG docker` hasn't taken effect yet) never triggers here — nothing to adapt.
on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main, dev]

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"

      - name: Run tests
        run: ./run-tests.sh
