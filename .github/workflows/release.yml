name: Release

# Builds docker/Dockerfile and publishes it to GHCR on every push to main — part of the release
# map (issue #100): https://github.com/peterderkoala/cinescout/issues/100. Deliberately no
# self-hosted runner here or anywhere else in this pipeline — a Watchtower instance running only
# on the operator's VPS (issue #103) is what actually applies new images; this job never touches
# the VPS in any way. The image is kept public (issue #100's Notes) so Watchtower needs no
# registry credentials — first push creates the GHCR package, whose visibility may need setting
# to public once by hand if it doesn't inherit it automatically.
on:
  push:
    branches: [main]
  # Lets this be re-run by hand (a bad build, or verifying the workflow itself) without needing
  # a fresh push to main.
  workflow_dispatch:

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v7

      - name: Compute short SHA
        id: vars
        run: echo "sha_short=$(git rev-parse --short HEAD)" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@v4.2.0

      - uses: docker/login-action@v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@v7.3.0
        with:
          context: .
          file: docker/Dockerfile
          push: true
          tags: |
            ghcr.io/peterderkoala/cinescout:latest
            ghcr.io/peterderkoala/cinescout:${{ steps.vars.outputs.sha_short }}
