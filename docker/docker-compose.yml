services:
  postgres:
    image: postgres:18
    restart: unless-stopped
    env_file:
      - .env
    volumes:
      # Postgres 18's official image expects a single mount at /var/lib/postgresql (it places
      # data in a major-version-specific subdirectory itself, for pg_ctlcluster compatibility)
      # — NOT the pre-18 convention of mounting straight at /var/lib/postgresql/data.
      - postgres-data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 10
    # Real observed peak (#55): ~92 MiB / 7.83% CPU during an active Hall-of-Fame crawl. These
    # limits give roughly 3x memory headroom and ~6x CPU headroom over that peak.
    mem_limit: 256m
    cpus: 0.5

  app:
    build:
      context: ..
      dockerfile: docker/Dockerfile
    restart: unless-stopped
    env_file:
      - .env
    volumes:
      # ASP.NET Core's DataProtection API defaults to this exact path for the container's "app"
      # user; without persisting it, every container restart generates a fresh key ring and
      # invalidates all existing auth cookies, logging everyone out — defeating the 30-day
      # sliding session the auth gate is built around.
      - dataprotection-keys:/home/app/.aspnet/DataProtection-Keys
    ports:
      - "8080:8080"
    depends_on:
      postgres:
        condition: service_healthy
    # Real observed peak (#55): ~214.6 MiB / ~24.6% CPU spike during an active Kinoheld seat
    # crawl (the highest of the three profiled conditions). These limits give roughly 2.4x
    # memory headroom and 4x CPU headroom over that peak.
    mem_limit: 512m
    cpus: 1.0

volumes:
  postgres-data:
  dataprotection-keys:
