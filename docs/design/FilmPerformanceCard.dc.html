<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
  <script src="./image-slot.js"></script>
  <style>
    :root {
      --cinescout-primary: #7A1F2B;
      --cinescout-on-primary: #fff;
      --cinescout-accent-match: #B8860B;
      --cinescout-accent-match-text: #8A6508;
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --cinescout-primary: #7A1F2B;
        --cinescout-on-primary: #fff;
        --cinescout-accent-match: #D1AB5B;
        --cinescout-accent-match-text: #D1AB5B;
      }
    }
  </style>
</helmet>
<sc-if value="{{ isCompact }}" hint-placeholder-val="{{ true }}">
  <div class="d-flex align-items-center justify-content-between gap-3 px-3 border-bottom flex-wrap" style="padding-top:10px; padding-bottom:10px; transition:background-color .12s ease;" style-hover="background-color:var(--bs-tertiary-bg);">
    <div class="d-flex align-items-center gap-2 flex-wrap">
      <sc-if value="{{ trackingBool }}"><i class="bi bi-bookmark-star-fill" title="Tracking" style="color:var(--cinescout-accent-match);"></i></sc-if>
      <a href="#" onClick="{{ select }}" class="fw-semibold text-decoration-none cs-heading" style="color:var(--bs-body-color);">{{ title }}</a>
      <span class="text-muted small">{{ datetime }}</span>
      <span class="text-muted small">{{ room }}</span>
    </div>
    <sc-if value="{{ hasBadge }}">
      <span class="badge {{ badgeClass }}">{{ badgeText }}</span>
    </sc-if>
  </div>
</sc-if>
<sc-if value="{{ isFeatured }}" hint-placeholder-val="{{ false }}">
  <div class="card shadow-sm h-100" style="{{ cardStyle }}">
    <div class="row g-0 h-100">
      <div class="col-4 col-md-3">
        <sc-if value="{{ hasPoster }}" hint-placeholder-val="{{ true }}">
          <image-slot id="{{ posterSlot }}" shape="rect" placeholder="Poster" style="width:100%;height:100%;min-height:170px;border-radius:.375rem 0 0 .375rem;"></image-slot>
        </sc-if>
        <sc-if value="{{ noPoster }}">
          <div class="d-flex align-items-center justify-content-center h-100 text-secondary" style="min-height:170px; background:var(--bs-secondary-bg); border-radius:.375rem 0 0 .375rem;">
            <i class="bi bi-film" style="font-size:2.5rem;"></i>
          </div>
        </sc-if>
      </div>
      <div class="col-8 col-md-9">
        <div class="card-body" style="padding:24px;">
          <sc-if value="{{ isMatch }}">
            <div class="text-uppercase fw-semibold mb-1 cs-heading" style="font-size:.7rem; letter-spacing:.08em; color:var(--cinescout-accent-match-text,#8A6508);">Match</div>
          </sc-if>
          <h5 class="card-title mb-1" style="{{ titleStyle }}">{{ title }}</h5>
          <p class="card-text text-muted mb-1 small">{{ cinemaRoom }}</p>
          <p class="card-text mb-2 small">{{ datetime }} · <strong>{{ price }}</strong></p>
          <sc-if value="{{ hasReasons }}">
            <div class="d-flex gap-1 flex-wrap mb-3">
              <sc-for list="{{ matchReasons }}" as="reason" hint-placeholder-count="2">
                <span class="badge {{ reason.badgeClass }}">{{ reason.text }}</span>
              </sc-for>
            </div>
          </sc-if>
          <sc-if value="{{ trackingOnlyBool }}">
            <div class="mb-3 small text-muted"><i class="bi bi-bookmark-star-fill" style="color:var(--cinescout-accent-match);"></i> Tracking</div>
          </sc-if>
          <a href="{{ bookingLink }}" target="_blank" rel="noopener" class="btn btn-sm d-inline-block mt-3" style="{{ ctaStyle }}">Book on Kinoheld</a>
        </div>
      </div>
    </div>
  </div>
</sc-if>
</x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;$preview&quot;:{&quot;width&quot;:460,&quot;height&quot;:90},&quot;variant&quot;:{&quot;editor&quot;:&quot;enum&quot;,&quot;options&quot;:[&quot;compact&quot;,&quot;featured&quot;],&quot;default&quot;:&quot;compact&quot;,&quot;tsType&quot;:&quot;string&quot;},&quot;title&quot;:{&quot;editor&quot;:&quot;text&quot;,&quot;default&quot;:&quot;Perfect Days&quot;,&quot;tsType&quot;:&quot;string&quot;},&quot;datetime&quot;:{&quot;editor&quot;:&quot;text&quot;,&quot;default&quot;:&quot;Fri, Aug 1 · 20:15&quot;,&quot;tsType&quot;:&quot;string&quot;},&quot;room&quot;:{&quot;editor&quot;:&quot;text&quot;,&quot;default&quot;:&quot;Saal 2&quot;,&quot;tsType&quot;:&quot;string&quot;},&quot;cinema&quot;:{&quot;editor&quot;:&quot;text&quot;,&quot;default&quot;:&quot;Kino am Rathaus&quot;,&quot;tsType&quot;:&quot;string&quot;},&quot;price&quot;:{&quot;editor&quot;:&quot;text&quot;,&quot;default&quot;:&quot;€9.50&quot;,&quot;tsType&quot;:&quot;string&quot;},&quot;status&quot;:{&quot;editor&quot;:&quot;enum&quot;,&quot;options&quot;:[&quot;none&quot;,&quot;available&quot;,&quot;soldout&quot;,&quot;cancelled&quot;],&quot;default&quot;:&quot;none&quot;,&quot;tsType&quot;:&quot;string&quot;},&quot;tracking&quot;:{&quot;editor&quot;:&quot;boolean&quot;,&quot;default&quot;:false,&quot;tsType&quot;:&quot;boolean&quot;},&quot;isMatch&quot;:{&quot;editor&quot;:&quot;boolean&quot;,&quot;default&quot;:false,&quot;tsType&quot;:&quot;boolean&quot;},&quot;matchReasons&quot;:{&quot;editor&quot;:null,&quot;default&quot;:[],&quot;tsType&quot;:&quot;string[]&quot;},&quot;posterSlot&quot;:{&quot;editor&quot;:null,&quot;default&quot;:&quot;&quot;,&quot;tsType&quot;:&quot;string&quot;},&quot;bookingLink&quot;:{&quot;editor&quot;:null,&quot;default&quot;:&quot;#&quot;,&quot;tsType&quot;:&quot;string&quot;},&quot;onSelect&quot;:{&quot;editor&quot;:null,&quot;default&quot;:null,&quot;tsType&quot;:&quot;() =&gt; void&quot;}}">
class Component extends DCLogic {
  renderVals() {
    const p = this.props;
    const variant = p.variant ?? "compact";
    const status = p.status ?? "none";
    const badgeMap = {
      cancelled: ["text-bg-secondary", "Cancelled"],
      soldout: ["text-bg-danger", "Sold out"],
      available: ["text-bg-success", "Seats available"],
    };
    const badge = badgeMap[status];
    const raw = Array.isArray(p.matchReasons) ? p.matchReasons
      : (p.matchReasons ? String(p.matchReasons).split(",").map(s => s.trim()).filter(Boolean) : []);
    const reasons = raw.map((r) => ({ text: r, badgeClass: /seat|free/i.test(r) ? "text-bg-success" : "text-bg-secondary" }));
    const isMatch = !!p.isMatch;
    const poster = p.posterSlot ?? "";

    return {
      isCompact: variant === "compact",
      isFeatured: variant === "featured",
      title: p.title ?? "Untitled",
      datetime: p.datetime ?? "",
      room: p.room ?? "",
      cinemaRoom: [p.cinema, p.room].filter(Boolean).join(" · "),
      price: p.price ?? "",
      posterSlot: poster,
      hasPoster: !!poster,
      noPoster: !poster,
      bookingLink: p.bookingLink ?? "#",
      select: (e) => { e.preventDefault(); if (p.onSelect) p.onSelect(); },
      trackingBool: !!p.tracking,
      trackingOnlyBool: !!p.tracking && !isMatch,
      hasBadge: !!badge,
      badgeClass: badge ? badge[0] : "",
      badgeText: badge ? badge[1] : "",
      hasReasons: reasons.length > 0,
      matchReasons: reasons,
      isMatch,
      cardStyle: isMatch
        ? "border-left:4px solid var(--cinescout-accent-match); box-shadow:0 0 0 1px rgba(184,134,11,.2), 0 .25rem .6rem rgba(0,0,0,.08);"
        : "",
      titleStyle: "color:var(--bs-body-color);",
      ctaStyle: "background:var(--cinescout-primary); border:1px solid var(--cinescout-primary); color:var(--cinescout-on-primary,#fff); font-weight:600;",
    };
  }
}
</script>
</body>
</html>
